<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join Network</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body class="bg-[#F7F7F5]">

<main>
  <section id="contact" class="max-w-7xl mx-auto px-8 py-24">
            <div class="bg-white rounded-3xl border border-[#E5EBE6] shadow-xl p-10 lg:p-16">
                <div class="max-w-3xl mb-10">
                    <h2 class="text-5xl text-[#04162c] mb-4" style="font-family:'Newsreader', serif;">Join the European Emotional
                        Education Network</h2>
                    <p class="text-lg text-gray-600 leading-8">
                        Complete this form to request membership, propose a collaboration, or receive more information
                        about the Network.
                    </p>
                </div>

                <form name="network-application" method="POST" data-netlify="true" netlify-honeypot="bot-field"
                    class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="hidden" name="form-name" value="network-application" />

                    <p class="hidden">
                        <label>Don’t fill this out: <input name="bot-field" /></label>
                    </p>

                    <div>
                        <label class="block mb-2 font-label-md text-label-md text-primary">Full name</label>
                        <input required name="full_name" type="text"
                            class="w-full rounded-lg border border-outline-variant px-4 py-3"
                            placeholder="Name and surname">
                    </div>

                    <div>
                        <label class="block mb-2 font-label-md text-label-md text-primary">Institution /
                            Organization</label>
                        <input required name="institution" type="text"
                            class="w-full rounded-lg border border-outline-variant px-4 py-3"
                            placeholder="University, school, NGO, company...">
                    </div>

                    <div>
                        <label class="block mb-2 font-label-md text-label-md text-primary">Email</label>
                        <input required name="email" type="email"
                            class="w-full rounded-lg border border-outline-variant px-4 py-3"
                            placeholder="institutional@email.com">
                    </div>

                    <div>
                        <label class="block mb-2 font-label-md text-label-md text-primary">Country</label>
                        <input required name="country" type="text"
                            class="w-full rounded-lg border border-outline-variant px-4 py-3" placeholder="Country">
                    </div>

                    <div>
                        <label class="block mb-2 font-label-md text-label-md text-primary">Membership interest</label>
                        <select required name="membership_interest"
                            class="w-full rounded-lg border border-outline-variant px-4 py-3">
                            <option value="">Select an option</option>
                            <option>Academic member</option>
                            <option>Educational institution</option>
                            <option>Research partner</option>
                            <option>Corporate / institutional partner</option>
                            <option>European project collaboration</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-2 font-label-md text-label-md text-primary">Main area of interest</label>
                        <select required name="area_interest"
                            class="w-full rounded-lg border border-outline-variant px-4 py-3">
                            <option value="">Select an option</option>
                            <option>Emotional education</option>
                            <option>Teacher training</option>
                            <option>Research and publications</option>
                            <option>Erasmus+ / European projects</option>
                            <option>Assessment and quality seal</option>
                            <option>Congress and events</option>
                        </select>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block mb-2 font-label-md text-label-md text-primary">Message</label>
                        <textarea required name="message" rows="6"
                            class="w-full rounded-lg border border-outline-variant px-4 py-3"
                            placeholder="Tell us briefly how you would like to collaborate with the Network."></textarea>
                    </div>

                    <div class="md:col-span-2 flex items-start gap-3">
                        <input required type="checkbox" name="privacy_acceptance" class="mt-1">
                        <label class="font-body-md text-body-md text-on-surface-variant">
                            I accept that my data will be used to manage my request and contact me regarding the
                            European Emotional Education Network.
                        </label>
                    </div>

                    <div class="md:col-span-2">
                        <button type="submit"
                            class="bg-primary text-white px-10 py-4 rounded-lg font-label-md text-label-md hover:shadow-lg transition-shadow">
                            Send application
                        </button>
                    </div>
                </form>
            </div>
  </section>
  </main>

</body>
</html>
